<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- Three board columns -->
  <g fill="#ffffff" opacity="0.55">
    <rect x="152" y="186" width="52" height="150" rx="10"/>
    <rect x="230" y="186" width="52" height="150" rx="10"/>
    <rect x="308" y="186" width="52" height="150" rx="10"/>
  </g>
  <!-- Task cards sitting on the columns -->
  <g fill="#ffffff">
    <rect x="152" y="210" width="52" height="26" rx="8"/>
    <rect x="230" y="210" width="52" height="26" rx="8"/>
    <rect x="230" y="254" width="52" height="26" rx="8"/>
    <rect x="308" y="210" width="52" height="26" rx="8"/>
  </g>
</svg>
