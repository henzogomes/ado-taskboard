name: Electron build

# Builds the packaged Electron desktop app and runs the headed smoke
# (test:electron) against the packaged build. Two jobs:
#
#   build-linux — AppImage + deb + pacman, headed smoke under xvfb. This is the
#     only place the deb target is built — some local Linux distros (e.g. Arch)
#     lack the libcrypt library electron-builder's bundled fpm needs, and a .deb
#     wouldn't install there anyway; ubuntu-latest provides libcrypt and the
#     pacman package is built natively by electron-builder regardless of the
#     host. (fpm's pacman backend shells out to `bsdtar`, which Ubuntu ships in
#     libarchive-tools.)
#
#   build-macos  — dmg + zip on macOS (unsigned: no Apple credentials in CI).
#     Runs after build-linux so both jobs attach their assets to the same GitHub
#     Release without racing the same tag. macOS runners have a WindowServer, so
#     the headed smoke runs without xvfb.
#
# Runs only on pushes to the `release` branch (or on demand via
# workflow_dispatch) — not on every commit to main. Bring main into release
# when you want a packaged build. (No `paths` filter here: on the first push
# of a new branch GitHub compares against the default branch, so an identical
# branch would be silently skipped.) On success the Linux job also creates or
# updates a GitHub Release (tagged with the app version) carrying the AppImage,
# deb, pacman, dmg and zip as separate downloadable assets.

on:
  workflow_dispatch:
  push:
    branches: [release]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Publishing the GitHub Release (attaching the deb/pacman/AppImage assets)
    # needs write access to contents via the GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # test:electron uses the global WebSocket (Node 22+).
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # fpm's pacman backend invokes `bsdtar` to build the package; Ubuntu
      # runners don't ship it, so install it explicitly (libarchive-tools).
      - name: Install pacman build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build web app
        run: npm run build

      - name: Build Linux packages (AppImage + deb + pacman)
        # `--publish never`: with CI detected, electron-builder would otherwise
        # attempt an implicit GitHub release needing a GH_TOKEN. Packaging stays
        # pure here; publishing is done explicitly by the release step below.
        run: npx electron-builder --linux --publish never

      # Smoke the PACKAGED app (not `electron .`), so a broken dependency
      # collection / packaging regression fails the build instead of passing.
      - name: Run headed Electron smoke on the packaged build
        run: xvfb-run -a env ELECTRON_SMOKE_BIN=release/linux-unpacked/ado-taskboard npm run test:electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ado-taskboard-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
          if-no-files-found: error

      - name: Read app version
        run: echo "APP_VERSION=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # Create (or update, if the tag already exists) a GitHub Release tagged
      # with the app version, with each package as a separate downloadable
      # asset. Bump package.json's version to get a new tag/release next build.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: ado-taskboard ${{ env.APP_VERSION }}
          body: |
            Packaged Linux build of ado-taskboard.
            - AppImage — portable; run anywhere (double-click needs FUSE2).
            - deb — Debian/Ubuntu.
            - pacman — Arch.
          files: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
          fail_on_unmatched_files: true

  build-macos:
    # Unsigned build (no Apple credentials in CI): sets CSC_IDENTITY_AUTO_DISCOVERY
    # false so electron-builder doesn't hunt for a signing identity. Gatekeeper
    # will flag the app on other Macs (right-click → Open) until signing +
    # notarization are wired in via secrets.
    runs-on: macos-15
    # Run after the Linux job so the two jobs attach their assets to the same
    # GitHub Release without racing the same tag.
    needs: build-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # test:electron uses the global WebSocket (Node 22+).
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build macOS packages (dmg + zip, unsigned)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Smoke the PACKAGED app (not `electron .`), so a broken dependency
      # collection / packaging regression fails the build instead of passing.
      # macOS runners have a WindowServer, so no xvfb. The glob `mac*` covers
      # the arch directory (mac/ vs mac-arm64/) whichever the runner is.
      - name: Run headed Electron smoke on the packaged build
        run: ELECTRON_SMOKE_BIN=release/mac*/ado-taskboard.app/Contents/MacOS/ado-taskboard npm run test:electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ado-taskboard-macos
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error

      - name: Read app version
        run: echo "APP_VERSION=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # Attach the dmg + zip to the Release the Linux job created. The tag
      # already exists by now (`needs: build-linux`), so `update_release_body:
      # false` keeps the Linux job's description intact and just adds the macOS
      # assets.
      - name: Publish macOS assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          update_release_body: false
          files: |
            release/*.dmg
            release/*-mac.zip
          fail_on_unmatched_files: true
