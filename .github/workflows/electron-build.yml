name: Electron Linux build

# Builds the packaged Electron desktop app for Linux (AppImage + deb + pacman)
# and runs the headed smoke (test:electron) under xvfb. This is the only place
# the deb target is built — some local Linux distros (e.g. Arch) lack the
# libcrypt library electron-builder's bundled fpm needs, and a .deb wouldn't
# install there anyway; ubuntu-latest provides libcrypt and the pacman package
# is built natively by electron-builder regardless of the host. (fpm's pacman
# backend shells out to `bsdtar`, which Ubuntu ships in libarchive-tools.)
#
# Runs only on pushes to the `release` branch (or on demand via
# workflow_dispatch) — not on every commit to main. Bring main into release
# when you want a packaged build. (No `paths` filter here: on the first push
# of a new branch GitHub compares against the default branch, so an identical
# branch would be silently skipped.) On success it also creates/updates a
# GitHub Release (tagged with the app version) carrying the AppImage, deb and
# pacman as separate downloadable assets.

on:
  workflow_dispatch:
  push:
    branches: [release]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Publishing the GitHub Release (attaching the deb/pacman/AppImage assets)
    # needs write access to contents via the GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # test:electron uses the global WebSocket (Node 22+).
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # fpm's pacman backend invokes `bsdtar` to build the package; Ubuntu
      # runners don't ship it, so install it explicitly (libarchive-tools).
      - name: Install pacman build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build web app
        run: npm run build

      - name: Build Linux packages (AppImage + deb + pacman)
        # `--publish never`: with CI detected, electron-builder would otherwise
        # attempt an implicit GitHub release needing a GH_TOKEN. Packaging stays
        # pure here; publishing is done explicitly by the release step below.
        run: npx electron-builder --linux --publish never

      # Smoke the PACKAGED app (not `electron .`), so a broken dependency
      # collection / packaging regression fails the build instead of passing.
      - name: Run headed Electron smoke on the packaged build
        run: xvfb-run -a env ELECTRON_SMOKE_BIN=release/linux-unpacked/ado-taskboard npm run test:electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ado-taskboard-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
          if-no-files-found: error

      - name: Read app version
        run: echo "APP_VERSION=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # Create (or update, if the tag already exists) a GitHub Release tagged
      # with the app version, with each package as a separate downloadable
      # asset. Bump package.json's version to get a new tag/release next build.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: ado-taskboard ${{ env.APP_VERSION }}
          body: |
            Packaged Linux build of ado-taskboard.
            - AppImage — portable; run anywhere (double-click needs FUSE2).
            - deb — Debian/Ubuntu.
            - pacman — Arch.
          files: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
          fail_on_unmatched_files: true
