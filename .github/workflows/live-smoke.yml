name: Live ADO smoke

# Read-only smoke against a real ADO org (see e2e/live.spec.ts). Runs on demand
# and weekly; gated on the ADO_PAT secret so forks/PRs without it skip the work.
# The PAT is passed to the BROWSER (seeded into localStorage by the spec) and
# relayed by the dev proxy per request — there is no server-side secret and no
# .env. Uses a throwaway/sandbox org per the repo's data-safety rule; the spec
# never writes.
#
# The `secrets` context is not available in `if` conditions (job- or
# step-level), so it is mapped into the job `env` below and the gate reads
# `env.ADO_PAT`; that was the reason this workflow used to be rejected as
# invalid.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      ADO_PAT: ${{ secrets.ADO_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: ${{ env.ADO_PAT != '' }}
        run: npm ci

      - name: Install Playwright browser
        if: ${{ env.ADO_PAT != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run live smoke
        if: ${{ env.ADO_PAT != '' }}
        env:
          ADO_ORG: ${{ secrets.ADO_ORG }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_TEAM: ${{ secrets.ADO_TEAM }}
        run: npm run test:e2e:live
